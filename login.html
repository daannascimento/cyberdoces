<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  font-family:Arial;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:white;
  padding:30px;
  border-radius:10px;
  width:350px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  box-sizing:border-box;
}

button{
  cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>Entrar</h2>

<input
type="email"
id="email"
placeholder="E-mail">

<input
type="password"
id="senha"
placeholder="Senha">

<button onclick="login()">
Entrar
</button>

</div>

<script>

const { createClient } = supabase;

const client = createClient(
  'https://ewiejygqzrgrwhkielln.supabase.co',
  'sb_publishable_yAeRrVsq2u0c3Sqv2-vg9g_669u8lLw'
);

async function login(){

  const email =
    document.getElementById('email').value;

  const senha =
    document.getElementById('senha').value;

  const { error } =
    await client.auth.signInWithPassword({

      email,
      password: senha

    });

  if(error){

    alert(error.message);

    return;
  }

  window.location.href = 'index.html';

}

</script>

</body>
</html>
