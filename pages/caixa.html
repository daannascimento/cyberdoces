<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fluxo de Caixa</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<div id="sidebar"></div>

<div class="main">

<div class="container">

<h1>Fluxo de Caixa</h1>

<!-- KPIs -->

<div class="kpi-grid">

    <div class="card">

        <h3>Entradas</h3>

        <div class="valor entrada" id="totalEntradas">
            R$ 0,00
        </div>

    </div>

    <div class="card">

        <h3>Saídas</h3>

        <div class="valor saida" id="totalSaidas">
            R$ 0,00
        </div>

    </div>

    <div class="card">

        <h3>Saldo Atual</h3>

        <div class="valor" id="saldoAtual">
            R$ 0,00
        </div>

    </div>

</div>

<!-- FORMULÁRIO -->

<div class="card">

<h3>Nova Movimentação</h3>

<div class="grid-2">

<div>

<label>Tipo</label>

<select id="tipo">

    <option value="entrada">Entrada</option>
    <option value="saida">Saída</option>

</select>

</div>

<div>

<label>Forma de Pagamento</label>

<select id="formaPagamento">

    <option value="pix">PIX</option>
    <option value="dinheiro">Dinheiro</option>
    <option value="credito">Crédito</option>
    <option value="debito">Débito</option>

</select>

</div>

</div>

<input
id="categoria"
placeholder="Categoria">

<input
id="descricao"
placeholder="Descrição">

<input
id="valor"
type="number"
placeholder="Valor">

<br><br>

<button onclick="salvarMovimentacao()">

    Salvar Movimentação

</button>

</div>

<!-- MOVIMENTAÇÕES -->

<div class="card">

<h3>Movimentações</h3>

<div class="table-responsive">

<table>

<thead>

<tr>

<th>Tipo</th>
<th>Categoria</th>
<th>Descrição</th>
<th>Forma</th>
<th>Valor</th>
<th>Data</th>

</tr>

</thead>

<tbody id="tabelaMovimentacoes"></tbody>

</table>

</div>

</div>

<!-- GRÁFICO -->

<div class="card">

<h3>Resumo Financeiro</h3>

<canvas id="grafico"></canvas>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/components.js"></script>
<script src="../js/services.js"></script>
<script src="../js/dashboardService.js"></script>

<script src="../js/caixa.js"></script>

</body>

</html>
