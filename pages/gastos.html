<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Gastos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="sidebar"></div>

    <div class="main">

        <div class="container">

            <h1>Controle de Gastos</h1>

            <div class="grid-2">

                <!-- FORMULÁRIO -->

                <div class="card">

                    <h3>Novo Gasto</h3>

                    <input id="valor" type="number" placeholder="Valor">

                    <select id="pessoa">

                        <option value="Dan">Dan</option>
                        <option value="Rafa">Rafa</option>

                    </select>

                    <input id="categoria" placeholder="Categoria">

                    <input id="parcelas" type="number" value="1" min="1" placeholder="Parcelas">

                    <input id="descricao" placeholder="Descrição">

                    <br><br>

                    <button onclick="salvar()">

                        Salvar Gasto

                    </button>

                </div>

                <!-- GRÁFICO -->

                <div class="card card-medium">

                    <h3>Investimento por Sócio</h3>

                    <canvas id="grafico"></canvas>

                </div>

            </div>

            <!-- TABELA -->

            <div class="card">

                <div class="table-title">

                    <h3>Lista de Gastos</h3>

                </div>

                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>Valor</th>
                                <th>Pessoa</th>
                                <th>Categoria</th>
                                <th>Descrição</th>
                                <th>Parcelas</th>

                            </tr>

                        </thead>

                        <tbody id="tabelaGastos"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/services.js"></script>
    <script src="../js/dashboardService.js"></script>

    <script src="../js/gastos.js"></script>

</body>

</html>
