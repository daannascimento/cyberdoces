<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Intelligence</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<div id="sidebar"></div>

<div class="main">

<div class="container">

<h1>Business Intelligence</h1>

<div class="card">

<div class="grid-4">

<div>

<label>Período</label>

<select id="periodo">

<option value="30">Últimos 30 dias</option>
<option value="60">Últimos 60 dias</option>
<option value="90">Últimos 90 dias</option>
<option value="0">Todo período</option>

</select>

</div>

<div>

<label>Categoria</label>

<select id="categoria">

<option>Todas</option>

</select>

</div>

<div>

<label>Produto</label>

<select id="produto">

<option>Todos</option>

</select>

</div>

<div style="display:flex;align-items:end">

<button id="btnAtualizar">

<i class="bi bi-arrow-clockwise"></i>

Atualizar

</button>

</div>

</div>

</div>

<div class="kpi-grid">

<div class="card">

<i class="bi bi-cash-stack kpi-icon"></i>

<h3>Receita</h3>

<div class="valor verde" id="kpiReceita">

R$ 0

</div>

</div>

<div class="card">

<i class="bi bi-cart3 kpi-icon"></i>

<h3>Vendas</h3>

<div class="valor" id="kpiVendas">

0

</div>

</div>

<div class="card">

<i class="bi bi-receipt kpi-icon"></i>

<h3>Ticket Médio</h3>

<div class="valor" id="kpiTicket">

R$ 0

</div>

</div>

<div class="card">

<i class="bi bi-graph-up-arrow kpi-icon"></i>

<h3>Lucro</h3>

<div class="valor verde" id="kpiLucro">

R$ 0

</div>

</div>

<div class="card">

<i class="bi bi-percent kpi-icon"></i>

<h3>Margem</h3>

<div class="valor" id="kpiMargem">

0%

</div>

</div>

<div class="card">

<i class="bi bi-box-seam kpi-icon"></i>

<h3>Produtos</h3>

<div class="valor" id="kpiProdutos">

0

</div>

</div>

</div>

<div class="grid-2">

<div class="card">

<h3>Receita por Dia</h3>

<canvas id="graficoReceita"></canvas>

</div>

<div class="card">

<h3>Vendas por Hora</h3>

<canvas id="graficoHora"></canvas>

</div>

</div>

<div class="grid-2">

<div class="card">

<h3>Categorias</h3>

<canvas id="graficoCategoria"></canvas>

</div>

<div class="card">

<h3>Formas de Pagamento</h3>

<canvas id="graficoPagamento"></canvas>

</div>

</div>

<div class="grid-2">

<div class="card">

<h3>Top Produtos</h3>

<div class="table-responsive">

<table>

<thead>

<tr>

<th>Produto</th>

<th>Qtd</th>

<th>Receita</th>

<th>Custo</th>

</tr>

</thead>

<tbody id="topProdutos"></tbody>

</table>

</div>

</div>

<div class="card">

<h3>Produtos de Menor Giro</h3>

<div class="table-responsive">

<table>

<thead>

<tr>

<th>Produto</th>

<th>Qtd</th>

<th>Receita</th>

</tr>

</thead>

<tbody id="baixoGiro"></tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/components.js"></script>
<script src="../js/services.js"></script>

<script src="../js/bi.js"></script>

</body>

</html>
