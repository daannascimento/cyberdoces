<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Reembolsos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

    <div id="sidebar"></div>

    <div class="main">

        <div class="container">

            <h1>Controle de Reembolsos</h1>

            <div class="grid">

                <div class="card">

                    <h3>Total Investido</h3>

                    <div class="valor" id="totalInvestido">

                        R$ 0,00

                    </div>

                </div>

                <div class="card">

                    <h3>Total Reembolsado</h3>

                    <div class="valor" id="totalReembolsado">

                        R$ 0,00

                    </div>

                </div>

                <div class="card">

                    <h3>Saldo Pendente</h3>

                    <div class="valor" id="saldoPendente">

                        R$ 0,00

                    </div>

                </div>

            </div>

            <div class="grid-2">

                <div class="card">

                    <h3>Novo Reembolso</h3>

                    <select id="pessoa">

                        <option value="Dan">Dan</option>
                        <option value="Rafa">Rafa</option>

                    </select>

                    <input id="valor" type="number" placeholder="Valor">

                    <input id="descricao" placeholder="Descrição">

                    <br>

                    <button onclick="registrarPagamento()">

                        Registrar Pagamento

                    </button>

                </div>

                <div class="card card-medium">

                    <h3>Resumo Financeiro</h3>

                    <canvas id="grafico"></canvas>

                </div>

            </div>

            <div class="card">

                <h3>Histórico</h3>

                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>Pessoa</th>
                                <th>Valor</th>
                                <th>Descrição</th>
                                <th>Data</th>

                            </tr>

                        </thead>

                        <tbody id="tabelaReembolsos"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/services.js"></script>
    <script src="../js/dashboardService.js"></script>

    <script src="../js/reembolsos.js"></script>

</body>

</html>
