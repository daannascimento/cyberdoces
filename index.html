<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Gastos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      max-width: 800px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #eee;
    }
  </style>
</head>

<body>

  <h1>Controle de Gastos</h1>

  <div class="menu">
  
    <a href="index.html">
      <button>Gastos</button>
    </a>
  
    <a href="reembolsos.html">
      <button>Reembolsos</button>
    </a>
  
    <a href="parcelas.html">
      <button>Parcelas</button>
    </a>
  
    <a href="caixa.html">
      <button>Caixa</button>
    </a>
  
  </div>

  <div class="card">
    <input id="valor" type="number" placeholder="Valor">

    <select id="pessoa">
      <option value="Dan">Dan</option>
      <option value="Rafa">Rafa</option>
    </select>

    <input id="categoria" placeholder="Categoria">
    <input id="parcelas" type="number" placeholder="Parcelas" value="1">
    <input id="descricao" placeholder="Descrição">

    <button onclick="salvar()">
      Salvar Gasto
    </button>
  </div>

  <div class="card">
    <canvas id="grafico"></canvas>
  </div>

  <div class="card">
    <h3>Lista de Gastos</h3>

    <table>
      <thead>
        <tr>
          <th>Valor</th>
          <th>Pessoa</th>
          <th>Categoria</th>
          <th>Descrição</th>
          <th>Parcelas</th>
        </tr>
      </thead>

      <tbody id="tabelaGastos"></tbody>
    </table>
  </div>

<script>

const { createClient } = supabase;

const client = createClient(
  'https://ewiejygqzrgrwhkielln.supabase.co',
  'sb_publishable_yAeRrVsq2u0c3Sqv2-vg9g_669u8lLw'
);

let grafico;

async function salvar() {

  const valor = document.getElementById('valor').value;
  const pessoa = document.getElementById('pessoa').value;
  const categoria = document.getElementById('categoria').value;
  const descricao = document.getElementById('descricao').value;
  const parcelas = parseInt(document.getElementById('parcelas').value || 1);
  const valorParcela = valor / parcelas;

  const { error } = await client
    .from('gastos')
    .insert([
      {
        valor,
        pessoa,
        categoria,
        descricao,
        parcelas,
        valor_parcela: valorParcela
      }
    ]);

  if (error) {
    alert('Erro ao salvar');
    console.log(error);
    return;
  }

  alert('Gasto salvo!');

  document.getElementById('valor').value = '';
  document.getElementById('categoria').value = '';
  document.getElementById('descricao').value = '';

  carregarDados();
}

async function carregarDados() {

  const { data, error } = await client
    .from('gastos')
    .select('*');

  if (error) {
    console.log(error);
    return;
  }

  carregarTabela(data);
  carregarGrafico(data);
}

function carregarTabela(data) {

  const tabela = document.getElementById('tabelaGastos');

  tabela.innerHTML = '';

  data.forEach(gasto => {

    tabela.innerHTML += `
      <tr>
        <td>R$ ${gasto.valor}</td>
        <td>${gasto.pessoa}</td>
        <td>${gasto.categoria}</td>
        <td>${gasto.descricao || ''}</td>
        <td>${gasto.parcelas || 1}x</td>
      </tr>
    `;

  });

}

function carregarGrafico(data) {

  let dan = 0;
  let rafa = 0;

  data.forEach(gasto => {

    if (gasto.pessoa === 'Dan') {
      dan += Number(gasto.valor);
    }

    if (gasto.pessoa === 'Rafa') {
      rafa += Number(gasto.valor);
    }

  });

  const ctx = document.getElementById('grafico');

  if (grafico) {
    grafico.destroy();
  }

  grafico = new Chart(ctx, {
    type: 'pie',

    data: {
      labels: ['Dan', 'Rafa'],

      datasets: [{
        data: [dan, rafa]
      }]
    }
  });

}

carregarDados();

</script>

</body>
</html>
