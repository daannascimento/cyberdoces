<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Parcelas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    .menu {
      text-align: center;
      margin-bottom: 20px;
    }

    .menu a button {
      width: auto;
      padding: 10px 20px;
      margin: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
    }

    .valor {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #eee;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

  </style>
</head>

<body>

<h1>Controle de Parcelas</h1>

<div class="menu">

  <a href="index.html">
    <button>Gastos</button>
  </a>

  <a href="reembolsos.html">
    <button>Reembolsos</button>
  </a>

  <a href="parcelas.html">
    <button>Parcelas</button>
  </a>

</div>

<div class="grid">

  <div class="card">
    <h3>Total Mensal</h3>

    <div class="valor" id="totalMensal">
      R$ 0
    </div>
  </div>

  <div class="card">
    <h3>Parcelas Abertas</h3>

    <div class="valor" id="parcelasAbertas">
      0
    </div>
  </div>

  <div class="card">
    <h3>Parcelas Quitadas</h3>

    <div class="valor" id="parcelasQuitadas">
      0
    </div>
  </div>

</div>

<div class="card">

  <table>

    <thead>
      <tr>
        <th>Descrição</th>
        <th>Pessoa</th>
        <th>Valor Total</th>
        <th>Parcela</th>
        <th>Valor Parcela</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="tabelaParcelas"></tbody>

  </table>

</div>

<script>

const { createClient } = supabase;

const client = createClient(
  'https://ewiejygqzrgrwhkielln.supabase.co',
  'sb_publishable_yAeRrVsq2u0c3Sqv2-vg9g_669u8lLw'
);

async function carregarParcelas() {

  const { data, error } = await client
    .from('gastos')
    .select('*');

  if (error) {
    console.log(error);
    return;
  }

  atualizarTabela(data);
  atualizarCards(data);
}

function atualizarTabela(data) {

  const tabela = document.getElementById('tabelaParcelas');

  tabela.innerHTML = '';

  data.forEach(gasto => {

    tabela.innerHTML += `
      <tr>

        <td>${gasto.descricao || ''}</td>

        <td>${gasto.pessoa}</td>

        <td>
          R$ ${Number(gasto.valor).toLocaleString('pt-BR')}
        </td>

        <td>
          ${gasto.parcela_atual || 1}/${gasto.parcelas || 1}
        </td>

        <td>
          R$ ${Number(gasto.valor_parcela || gasto.valor).toLocaleString('pt-BR')}
        </td>

        <td>
          ${gasto.quitado ? 'Quitado' : 'Aberto'}
        </td>

        <td>

          <button onclick="avancarParcela('${gasto.id}')">
            Próxima
          </button>

        </td>

      </tr>
    `;

  });

}

function atualizarCards(data) {

  let totalMensal = 0;
  let abertas = 0;
  let quitadas = 0;

  data.forEach(gasto => {

    if (gasto.quitado) {
      quitadas++;
    } else {
      abertas++;

      totalMensal += Number(
        gasto.valor_parcela || gasto.valor
      );
    }

  });

  document.getElementById('totalMensal').innerText =
    'R$ ' + totalMensal.toLocaleString('pt-BR');

  document.getElementById('parcelasAbertas').innerText =
    abertas;

  document.getElementById('parcelasQuitadas').innerText =
    quitadas;
}

async function avancarParcela(id) {

  const { data } = await client
    .from('gastos')
    .select('*')
    .eq('id', id)
    .single();

  let parcelaAtual = data.parcela_atual || 1;

  parcelaAtual++;

  let quitado = false;

  if (parcelaAtual >= data.parcelas) {
    parcelaAtual = data.parcelas;
    quitado = true;
  }

  await client
    .from('gastos')
    .update({
      parcela_atual: parcelaAtual,
      quitado
    })
    .eq('id', id);

  carregarParcelas();
}

carregarParcelas();

</script>

</body>
</html>
