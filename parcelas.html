<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Parcelas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    .menu {
      text-align: center;
      margin-bottom: 20px;
    }

    .menu a button {
      width: auto;
      padding: 10px 20px;
      margin: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .valor {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #eee;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .status-aberto {
      color: orange;
      font-weight: bold;
    }

    .status-quitado {
      color: green;
      font-weight: bold;
    }

  </style>
</head>

<body>

<h1>Controle de Parcelas</h1>

<div class="menu">
  
    <a href="index.html">
      <button>Gastos</button>
    </a>
  
    <a href="reembolsos.html">
      <button>Reembolsos</button>
    </a>
  
    <a href="parcelas.html">
      <button>Parcelas</button>
    </a>
  
    <a href="caixa.html">
      <button>Caixa</button>
    </a>

    <a href="vendas.html">
      <button>Vendas</button>
    </a>
  
  </div>


<div class="grid">

  <div class="card">
    <h3>Total Mensal</h3>

    <div class="valor" id="totalMensal">
      R$ 0
    </div>
  </div>

  <div class="card">
    <h3>Parcelas Abertas</h3>

    <div class="valor" id="parcelasAbertas">
      0
    </div>
  </div>

  <div class="card">
    <h3>Parcelas Quitadas</h3>

    <div class="valor" id="parcelasQuitadas">
      0
    </div>
  </div>

</div>

<div class="card">

  <h3>Filtros</h3>

  <select id="filtroPessoa" onchange="carregarParcelas()">

    <option value="">Todas Pessoas</option>

    <option value="Dan">Dan</option>

    <option value="Rafa">Rafa</option>

  </select>

  <select id="filtroStatus" onchange="carregarParcelas()">

    <option value="">Todos Status</option>

    <option value="aberto">Abertos</option>

    <option value="quitado">Quitados</option>

  </select>

</div>

<div class="card">

  <h3>Previsão Financeira</h3>

  <table>

    <thead>
      <tr>
        <th>Mês</th>
        <th>Total Previsto</th>
      </tr>
    </thead>

    <tbody id="tabelaPrevisao"></tbody>

  </table>

</div>

<div class="card">

  <table>

    <thead>
      <tr>
        <th>Descrição</th>
        <th>Pessoa</th>
        <th>Valor Total</th>
        <th>Parcela</th>
        <th>Valor Parcela</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="tabelaParcelas"></tbody>

  </table>

</div>

<script>

const { createClient } = supabase;

const client = createClient(
  'https://ewiejygqzrgrwhkielln.supabase.co',
  'sb_publishable_yAeRrVsq2u0c3Sqv2-vg9g_669u8lLw'
);

(async () => {

  const {
    data: { session }
  } = await client.auth.getSession();

  if(!session){

    window.location.href = 'login.html';

  }

})();

async function carregarParcelas() {

  let query = client
    .from('gastos')
    .select('*');

  const filtroPessoa =
    document.getElementById('filtroPessoa')?.value;

  const filtroStatus =
    document.getElementById('filtroStatus')?.value;

  if (filtroPessoa) {
    query = query.eq('pessoa', filtroPessoa);
  }

  if (filtroStatus === 'aberto') {
    query = query.eq('quitado', false);
  }

  if (filtroStatus === 'quitado') {
    query = query.eq('quitado', true);
  }

  const { data, error } = await query;

  if (error) {
    console.log(error);
    return;
  }

  atualizarTabela(data);
  atualizarCards(data);
  atualizarPrevisao(data);
}

function atualizarTabela(data) {

  const tabela = document.getElementById('tabelaParcelas');

  tabela.innerHTML = '';

  data.forEach(gasto => {

    tabela.innerHTML += `
      <tr>

        <td>${gasto.descricao || ''}</td>

        <td>${gasto.pessoa}</td>

        <td>
          R$ ${Number(gasto.valor).toLocaleString('pt-BR')}
        </td>

        <td>
          ${gasto.parcela_atual || 1}/${gasto.parcelas || 1}
        </td>

        <td>
          R$ ${Number(gasto.valor_parcela || gasto.valor).toLocaleString('pt-BR')}
        </td>

        <td class="${gasto.quitado ? 'status-quitado' : 'status-aberto'}">
          ${gasto.quitado ? 'Quitado' : 'Aberto'}
        </td>

        <td>

          <button onclick="avancarParcela('${gasto.id}')">
            Próxima
          </button>

        </td>

      </tr>
    `;

  });

}

function atualizarCards(data) {

  let totalMensal = 0;
  let abertas = 0;
  let quitadas = 0;

  data.forEach(gasto => {

    if (gasto.quitado) {

      quitadas++;

    } else {

      abertas++;

      totalMensal += Number(
        gasto.valor_parcela || gasto.valor
      );

    }

  });

  document.getElementById('totalMensal').innerText =
    'R$ ' + totalMensal.toLocaleString('pt-BR');

  document.getElementById('parcelasAbertas').innerText =
    abertas;

  document.getElementById('parcelasQuitadas').innerText =
    quitadas;
}

function atualizarPrevisao(data) {

  const tabela =
    document.getElementById('tabelaPrevisao');

  tabela.innerHTML = '';

  const previsao = {};

  data.forEach(gasto => {

    if (gasto.quitado) return;

    const parcelasRestantes =
      (gasto.parcelas || 1) -
      (gasto.parcela_atual || 1) + 1;

    const valor =
      Number(gasto.valor_parcela || gasto.valor);

    for (let i = 0; i < parcelasRestantes; i++) {

      const dataBase = new Date();

      dataBase.setMonth(dataBase.getMonth() + i);

      const chave =
        dataBase.toLocaleString('pt-BR', {
          month: 'long',
          year: 'numeric'
        });

      previsao[chave] =
        (previsao[chave] || 0) + valor;
    }

  });

  Object.entries(previsao)
    .forEach(([mes, total]) => {

      tabela.innerHTML += `
        <tr>
          <td>${mes}</td>
          <td>
            R$ ${total.toLocaleString('pt-BR')}
          </td>
        </tr>
      `;
    });
}

async function avancarParcela(id) {
  await client
  .from('movimentacoes')
  .insert([
    {
      tipo: 'saida',
      categoria: 'parcelas',
      descricao: data.descricao,
      valor: data.valor_parcela || data.valor,
      forma_pagamento: 'credito'
    }
  ]);
  const { data } = await client
    .from('gastos')
    .select('*')
    .eq('id', id)
    .single();

  let parcelaAtual = data.parcela_atual || 1;

  parcelaAtual++;

  let quitado = false;

  if (parcelaAtual >= data.parcelas) {

    parcelaAtual = data.parcelas;

    quitado = true;
  }

  await client
    .from('gastos')
    .update({
      parcela_atual: parcelaAtual,
      quitado
    })
    .eq('id', id);

  carregarParcelas();
}

carregarParcelas();

</script>

</body>
</html>
