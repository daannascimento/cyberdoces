<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  font-family: Arial;
  background:#f5f5f5;
  padding:20px;
  margin:0;
}

h1{
  text-align:center;
}

.menu{
  text-align:center;
  margin-bottom:20px;
}

.menu a button{
  width:auto;
  padding:10px 20px;
  margin:5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:10px;
  padding:20px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.valor{
  font-size:28px;
  font-weight:bold;
  margin-top:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:left;
}

th{
  background:#eee;
}

.verde{
  color:green;
}

</style>

</head>

<body>

<h1>Dashboard de Vendas</h1>

<div class="menu">

  <a href="index.html">
    <button>Gastos</button>
  </a>

  <a href="reembolsos.html">
    <button>Reembolsos</button>
  </a>

  <a href="parcelas.html">
    <button>Parcelas</button>
  </a>

  <a href="caixa.html">
    <button>Caixa</button>
  </a>

  <a href="vendas.html">
    <button>Vendas</button>
  </a>

</div>

<div class="grid">

  <div class="card">
    <h3>Faturamento Hoje</h3>
    <div class="valor verde" id="faturamentoHoje">
      R$ 0,00
    </div>
  </div>

  <div class="card">
    <h3>Vendas Hoje</h3>
    <div class="valor" id="vendasHoje">
      0
    </div>
  </div>

  <div class="card">
    <h3>Ticket Médio</h3>
    <div class="valor" id="ticketMedio">
      R$ 0,00
    </div>
  </div>

  <div class="card">
    <h3>Faturamento Acumulado</h3>
    <div class="valor verde" id="faturamentoMes">
      R$ 0,00
    </div>
  </div>

</div>

<div class="card">

  <h3>Histórico de Vendas</h3>

  <table>

```
<thead>

  <tr>
    <th>Data</th>
    <th>Vendas</th>
    <th>Faturamento</th>
    <th>Ticket Médio</th>
  </tr>

</thead>

<tbody id="tabelaVendas"></tbody>
```

  </table>

</div>

<script>

const { createClient } = supabase;

const client = createClient(
  'https://ewiejygqzrgrwhkielln.supabase.co',
  'sb_publishable_yAeRrVsq2u0c3Sqv2-vg9g_669u8lLw'
);

async function carregarVendas(){

  const { data, error } = await client
    .from('vendas_resumo')
    .select('*')
    .order('data_venda', { ascending:false });

  if(error){
    console.log(error);
    return;
  }

  atualizarCards(data);
  atualizarTabela(data);

}

function atualizarCards(data){

  if(data.length === 0) return;

  const hoje = data[0];

  const faturamentoHoje =
    Number(hoje.valor_bruto || 0);

  const vendasHoje =
    Number(hoje.quantidade_vendas || 0);

  const ticket =
    vendasHoje > 0
      ? faturamentoHoje / vendasHoje
      : 0;

  const faturamentoMes =
    data.reduce((total,item) =>
      total + Number(item.valor_bruto || 0),0);

  document.getElementById('faturamentoHoje').innerText =
    'R$ ' + faturamentoHoje.toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits:2
      }
    );

  document.getElementById('vendasHoje').innerText =
    vendasHoje;

  document.getElementById('ticketMedio').innerText =
    'R$ ' + ticket.toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits:2
      }
    );

  document.getElementById('faturamentoMes').innerText =
    'R$ ' + faturamentoMes.toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits:2
      }
    );

}

function atualizarTabela(data){

  const tabela =
    document.getElementById('tabelaVendas');

  tabela.innerHTML = '';

  data.forEach(item => {

    const ticket =
      Number(item.quantidade_vendas) > 0
      ? Number(item.valor_bruto) /
        Number(item.quantidade_vendas)
      : 0;

    tabela.innerHTML += `
      <tr>

        <td>
          ${new Date(item.data_venda)
            .toLocaleDateString('pt-BR')}
        </td>

        <td>
          ${item.quantidade_vendas}
        </td>

        <td>
          R$ ${Number(item.valor_bruto)
            .toLocaleString(
              'pt-BR',
              {
                minimumFractionDigits:2
              }
            )}
        </td>

        <td>
          R$ ${ticket.toLocaleString(
            'pt-BR',
            {
              minimumFractionDigits:2
            }
          )}
        </td>

      </tr>
    `;

  });

}

carregarVendas();

</script>

</body>
</html>
